<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 할 일</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#22382f;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100vh;padding:70px 20px}.app{max-width:620px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:700;color:#6c8277}h1{font-size:42px;letter-spacing:-2px;margin:12px 0}#date{color:#79857b;font-size:14px}.badge{background:#dfe8d6;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;font-size:30px}.card{margin-top:32px;background:#fffefb;padding:28px;border-radius:24px;box-shadow:0 15px 50px #22382f08}form{display:flex;gap:10px}input{min-width:0;flex:1;padding:16px;border:1px solid #dedfd5;border-radius:12px;font:inherit;background:#fafaf6}input:focus{outline:2px solid #7f9c77;outline-offset:2px}button{cursor:pointer;font:inherit;border:0}form button{padding:0 21px;border-radius:12px;background:#294d3d;color:white;font-weight:700}.meta{display:flex;justify-content:space-between;margin:26px 0 16px;align-items:center;font-size:13px;color:#778176}.filters{display:flex;gap:4px}.filters button{background:transparent;color:#788379;padding:7px 10px;border-radius:8px}.filters button.active{background:#eaf0e3;color:#294d3d;font-weight:700}ul{list-style:none;padding:0;margin:0}li{display:flex;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid #eeeee6}.check{border:1.5px solid #c8d1c1;background:white;width:24px;height:24px;border-radius:8px;flex-shrink:0;color:white}.done .check{background:#6d8a60;border-color:#6d8a60}.label{flex:1;overflow-wrap:anywhere;line-height:1.6}.done .label{text-decoration:line-through;color:#9ba397}.delete{background:transparent;color:#9ca597;font-size:22px;padding:0 6px}.delete:hover{color:#bd5656}.empty{text-align:center;padding:45px 0;color:#8b9588;font-size:14px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:#8b9588;font-size:12px}#clear{background:transparent;color:#7c8875;font-size:12px;padding:8px}footer{text-align:center;color:#929b8b;font-size:12px;margin-top:25px}button:focus-visible{outline:2px solid #64825b;outline-offset:3px}@media(max-width:480px){body{padding:38px 16px}.card{padding:20px}h1{font-size:36px}.meta{align-items:flex-start;gap:12px;flex-direction:column}form button{padding:0 16px}}
</style></head>
<body><main class="app"><header><div><div class="eyebrow">ONE THING AT A TIME</div><h1>오늘의 할 일<span style="color:#8aa176">.</span></h1><div id="date"></div></div><div class="badge" aria-hidden="true">✦</div></header>
<section class="card" aria-label="투두리스트"><form id="form"><input id="input" aria-label="새 할 일" placeholder="어떤 일을 해볼까요?" maxlength="300" autocomplete="off" required><button>추가 +</button></form><div class="meta"><span id="count" aria-live="polite"></span><nav class="filters" aria-label="할 일 필터"><button type="button" class="active" data-filter="all" aria-pressed="true">전체</button><button type="button" data-filter="active" aria-pressed="false">진행 중</button><button type="button" data-filter="done" aria-pressed="false">완료</button></nav></div><ul id="list"></ul><div id="empty" class="empty">아직 할 일이 없어요.<br>작은 일 하나부터 시작해 보세요.</div><div class="bottom"><span id="progress">오늘도 차근차근 🌿</span><button id="clear" type="button">완료한 일 정리</button></div></section><footer id="storage">이 브라우저에 자동으로 저장됩니다.</footer></main>
<script>
const $=s=>document.querySelector(s);let tasks=[],filter='all';
try{const saved=JSON.parse(localStorage.getItem('simple-todo-v1')||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean')}catch{}
$('#date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
function save(){try{localStorage.setItem('simple-todo-v1',JSON.stringify(tasks))}catch{$('#storage').textContent='저장 공간을 사용할 수 없어, 이 창을 닫으면 내용이 사라집니다.'}render()}
function render(){const remaining=tasks.filter(t=>!t.done).length;$('#count').textContent=`남은 할 일 ${remaining}개`;$('#progress').textContent=tasks.length?`${tasks.length}개 중 ${tasks.length-remaining}개 완료`:'오늘도 차근차근 🌿';const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));$('#list').replaceChildren();$('#empty').hidden=visible.length>0;$('#empty').textContent=tasks.length?'이 목록에는 할 일이 없어요.':'아직 할 일이 없어요. 작은 일 하나부터 시작해 보세요.';for(const task of visible){const li=document.createElement('li');li.className=task.done?'done':'';const check=document.createElement('button');check.className='check';check.type='button';check.textContent=task.done?'✓':'';check.setAttribute('aria-label',task.text+' 완료 상태 변경');check.setAttribute('aria-pressed',String(task.done));check.onclick=()=>{task.done=!task.done;save()};const label=document.createElement('span');label.className='label';label.textContent=task.text;const del=document.createElement('button');del.className='delete';del.type='button';del.textContent='×';del.setAttribute('aria-label',task.text+' 삭제');del.onclick=()=>{tasks=tasks.filter(t=>t.id!==task.id);save()};li.append(check,label,del);$('#list').append(li)}}
$('#form').onsubmit=e=>{e.preventDefault();const text=$('#input').value.trim();if(!text)return;tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),text,done:false});$('#input').value='';save();$('#input').focus()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});$('#clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};render();
</script></body></html>
